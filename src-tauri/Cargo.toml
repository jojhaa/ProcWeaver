[package]
name = "proc-weaver"
version = "2.0.1"
license = "AGPL-3.0-only"
description = "Modern Proxy Client powered by Mihomo and Tauri"
authors = ["ProcWeaver Team"]
edition = "2021"

[lib]
name = "proc_weaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ProcWeaver"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.34"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "socks"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
windows = { version = "=0.61.3", features = ["Win32_System_Wmi", "Win32_System_Com", "Win32_System_Variant", "Win32_Security", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
